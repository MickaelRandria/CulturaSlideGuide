<!DOCTYPE html>
<html lang="fr" class="h-full bg-[#F4F6FB] text-slate-900 antialiased selection:bg-[#0066FF] selection:text-white">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cultura — Compagnon Routine Data</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel standalone -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Plus Jakarta Sans & Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cultura: {
                            DEFAULT: '#005088',
                            electric: '#0066FF',
                            light: '#EEF4FF',
                            border: '#D0E1FF',
                            dark: '#003358',
                        }
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            -webkit-tap-highlight-color: transparent;
            background-color: #F4F6FB;
            color: #1E293B;
        }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 99px; }
        
        .active-scale {
            transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.15s ease;
        }
        .active-scale:active {
            transform: scale(0.97);
        }
        
        .glass-dock {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .completed-card {
            opacity: 0.65;
        }
    </style>
</head>
<body class="h-full pb-24 text-slate-800">
    <div id="root" class="min-h-full flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const GOOGLE_SHEET_URL = "https://docs.google.com/spreadsheets/d/1HHj0tBer-Jdzy1E5RzwUveLguDSXxyQkPysB4J323J4/edit?gid=2117605739#gid=2117605739";

        const TASKS_DATA = [
            {
                id: 'location',
                title: 'Location',
                targetInfo: 'Prix Total HT (S-1)',
                icon: '📦',
                link: 'https://location.cultura.com/admin/transactions',
                bgClass: 'bg-[#EEF4FF] border-[#C2D8FF]',
                nodeColor: 'bg-[#0066FF]',
                steps: [
                    'Ouvrir l\'administration des transactions Location',
                    'Exporter la plage de la semaine passée (S-1) au format CSV',
                    'Récupérer le Prix Total HT et le reporter dans le Sheet'
                ]
            },
            {
                id: 'pbi_ca_ent',
                title: 'Power BI — CA Enterprise',
                targetInfo: 'Chiffre d\'Affaires CA Enterprise (S-1)',
                icon: '📊',
                link: 'https://app.fabric.microsoft.com/groups/me/apps/b57ba65b-c24e-4f5f-a67e-2bba90887f9e/reports/c75c6996-8d0a-411c-ae36-642bf2cad328/55b11de6da5c4b1c9667?ctid=37ddb62e-1d49-42b1-aacc-e08f83d1253d&redirectedFromSignup=1,1&experience=power-bi',
                bgClass: 'bg-[#FFEFEB] border-[#FFC8BC]',
                nodeColor: 'bg-[#FF5533]',
                steps: [
                    'Sélecteur VA Dynamique ➔ mettre sur "Tout" partout',
                    'Filtrer sur la période Semaine Passée (S-1)',
                    'Noter le chiffre d\'affaires CA Enterprise dans le Sheet'
                ]
            },
            {
                id: 'pbi_marge_web',
                title: 'Power BI — Marge Web',
                targetInfo: 'Pourcentage % Marge Web (S-1)',
                icon: '💻',
                link: 'https://app.fabric.microsoft.com/groups/me/apps/b57ba65b-c24e-4f5f-a67e-2bba90887f9e/reports/c75c6996-8d0a-411c-ae36-642bf2cad328/55b11de6da5c4b1c9667?ctid=37ddb62e-1d49-42b1-aacc-e08f83d1253d&redirectedFromSignup=1,1&experience=power-bi',
                bgClass: 'bg-[#F4EFFF] border-[#D9C8FF]',
                nodeColor: 'bg-[#8B5CF6]',
                steps: [
                    'Canal de vente ➔ sélectionner "Web"',
                    'CEC ➔ sélectionner "B2C"',
                    'Reporter le % de Marge Web S-1 dans le Sheet'
                ]
            },
            {
                id: 'pbi_ecom_ccw',
                title: 'Power BI — CA Ecom CCW',
                targetInfo: 'Expédié : Total (Ecom + CCW) (S-1)',
                icon: '🚚',
                link: 'https://app.fabric.microsoft.com/groups/me/apps/0c040b49-d730-4047-ba7c-65b8937b0fb2/reports/07e1b5f9-2cc9-4093-bc18-2f3bdf4c4491/404d3ead94a78681c7b5?experience=fabric-developer',
                bgClass: 'bg-[#FFFBEB] border-[#FDE68A]',
                nodeColor: 'bg-[#F59E0B]',
                steps: [
                    'Accéder au rapport Power BI Ecom & CCW',
                    'Se positionner sur l\'onglet "Expédié"',
                    'Reporter le Total (Ecom + CCW) pour S-1 dans le Sheet'
                ]
            },
            {
                id: 'marketplace',
                title: 'Marketplace',
                targetInfo: 'Données Marketplace — Ligne 7',
                icon: '🏪',
                link: 'https://cultura365.sharepoint.com/:x:/s/Marketplace/EQ-yjtSHyylAkh8C4EqYoHgBqUnmG-xDbX841U4qRbHJWg?e=fCFja0',
                bgClass: 'bg-[#ECFDF5] border-[#A7F3D0]',
                nodeColor: 'bg-[#10B981]',
                steps: [
                    'Ouvrir le fichier SharePoint Marketplace',
                    'Vérifier que l\'équipe a mis à jour la semaine (Ligne 7)',
                    'Si du retard est constaté ➔ contacter Claire (équipe MKP)'
                ]
            },
            {
                id: 'vivlio',
                title: 'Ebook Vivlio',
                targetInfo: 'Partie bleue du graphique Camembert',
                icon: '📚',
                bgClass: 'bg-[#F0F9FF] border-[#BAE6FD]',
                nodeColor: 'bg-[#0284C7]',
                credentials: {
                    user: 'A.corbal',
                    pass: 'Charles1963!'
                },
                steps: [
                    'Se connecter avec les identifiants Vivlio indiqués ci-dessous',
                    'Consulter le camembert de répartition',
                    'Prendre la valeur de la partie bleue et la mettre dans le Sheet'
                ]
            },
            {
                id: 'magasin',
                title: 'Magasin — Taux Transformation',
                targetInfo: 'Taux de transformation Magasin (S-1)',
                icon: '🏬',
                link: 'https://hub.cultura.intra/portal/auth/portal/hub/Commerce/Indicateurs+commerciaux/Taux+de+transformation',
                bgClass: 'bg-[#FDF2F8] border-[#FBCFE8]',
                nodeColor: 'bg-[#EC4899]',
                steps: [
                    'Accéder à l\'intranet Hub Cultura',
                    'Sélectionner la bonne semaine (S-1)',
                    'Copier le Taux de transformation Magasin dans le Sheet'
                ]
            }
        ];

        const LOOKER_SLIDES = [
            { id: 's1', label: 'Slide Obj sources', desc: 'Objectifs & Sources de trafic', icon: '🎯' },
            { id: 's2', label: 'Trafic métier', desc: 'Sessions & Fréquentation', icon: '📈' },
            { id: 's3', label: 'V2.1 SD+ Vivlio', desc: 'Synthèse V2.1 SD+ & Vivlio', icon: '📖' },
            { id: 's4', label: 'Commandé', desc: 'Vue Ventes Commandées', icon: '🛒' },
            { id: 's5', label: 'Expédié', desc: 'Vue Ventes Expédiées', icon: '📦' },
        ];

        function App() {
            const [activeTab, setActiveTab] = useState('tasks');

            const [completedTasks, setCompletedTasks] = useState(() => {
                try {
                    const saved = localStorage.getItem('cultura_companion_tasks');
                    return saved ? JSON.parse(saved) : {};
                } catch(e) { return {}; }
            });

            const [slidesDone, setSlidesDone] = useState(() => {
                try {
                    const saved = localStorage.getItem('cultura_companion_slides');
                    return saved ? JSON.parse(saved) : {};
                } catch(e) { return {}; }
            });

            const [lookerVerified, setLookerVerified] = useState(() => {
                try {
                    const saved = localStorage.getItem('cultura_companion_looker');
                    return saved ? JSON.parse(saved) : false;
                } catch(e) { return false; }
            });

            const [toast, setToast] = useState(null);

            useEffect(() => {
                localStorage.setItem('cultura_companion_tasks', JSON.stringify(completedTasks));
            }, [completedTasks]);

            useEffect(() => {
                localStorage.setItem('cultura_companion_slides', JSON.stringify(slidesDone));
            }, [slidesDone]);

            useEffect(() => {
                localStorage.setItem('cultura_companion_looker', JSON.stringify(lookerVerified));
            }, [lookerVerified]);

            const showToast = (msg) => {
                setToast(msg);
                setTimeout(() => setToast(null), 2500);
            };

            const copyText = (text, label) => {
                if (navigator.clipboard && window.isSecureContext) {
                    navigator.clipboard.writeText(text);
                } else {
                    const textArea = document.createElement("textarea");
                    textArea.value = text;
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textArea);
                }
                showToast(`${label || 'Élément'} copié dans le presse-papier !`);
            };

            const taskCount = TASKS_DATA.length;
            const completedTaskCount = Object.values(completedTasks).filter(Boolean).length;

            const slidesCount = LOOKER_SLIDES.length;
            const completedSlidesCount = Object.values(slidesDone).filter(Boolean).length;

            const totalSteps = taskCount + 1 + slidesCount;
            const currentDone = completedTaskCount + (lookerVerified ? 1 : 0) + completedSlidesCount;
            const progressPercent = Math.round((currentDone / totalSteps) * 100);

            const toggleTask = (id) => {
                setCompletedTasks(prev => ({ ...prev, [id]: !prev[id] }));
            };

            const toggleSlide = (id) => {
                setSlidesDone(prev => ({ ...prev, [id]: !prev[id] }));
            };

            const resetAll = () => {
                setCompletedTasks({});
                setSlidesDone({});
                setLookerVerified(false);
                showToast("Progression réinitialisée pour aujourd'hui !");
            };

            return (
                <div className="flex-1 flex flex-col max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 pt-5 pb-28 md:pb-12">
                    
                    {}
                    <header className="flex items-center justify-between gap-3 mb-6 bg-white p-3 md:p-4 rounded-3xl border border-slate-200/80 shadow-xs">
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 rounded-2xl bg-cultura text-white flex items-center justify-center font-black text-lg shadow-sm">
                                C
                            </div>
                            <div>
                                <h1 className="text-base md:text-lg font-black text-slate-900 leading-tight">
                                    Compagnon Data
                                </h1>
                                <p className="text-[11px] text-slate-500 font-semibold hidden sm:block">
                                    Guide d'aide au remplissage du Google Sheet
                                </p>
                            </div>
                        </div>

                        {/* DESKTOP TABS */}
                        <nav className="hidden md:flex items-center gap-1 bg-slate-100 p-1.5 rounded-full border border-slate-200/60">
                            <button 
                                onClick={() => setActiveTab('tasks')}
                                className={`px-4 py-2 rounded-full text-xs font-bold transition active-scale ${
                                    activeTab === 'tasks' ? 'bg-white text-cultura shadow-xs' : 'text-slate-600 hover:text-slate-900'
                                }`}
                            >
                                <i className="fa-solid fa-list-check mr-2"></i>1. Guide & Liens ({completedTaskCount}/{taskCount})
                            </button>
                            <button 
                                onClick={() => setActiveTab('looker')}
                                className={`px-4 py-2 rounded-full text-xs font-bold transition active-scale ${
                                    activeTab === 'looker' ? 'bg-white text-cultura shadow-xs' : 'text-slate-600 hover:text-slate-900'
                                }`}
                            >
                                <i className="fa-solid fa-chart-line mr-2"></i>2. Looker Studio {lookerVerified ? '✅' : ''}
                            </button>
                            <button 
                                onClick={() => setActiveTab('ppt')}
                                className={`px-4 py-2 rounded-full text-xs font-bold transition active-scale ${
                                    activeTab === 'ppt' ? 'bg-white text-cultura shadow-xs' : 'text-slate-600 hover:text-slate-900'
                                }`}
                            >
                                <i className="fa-solid fa-file-powerpoint mr-2"></i>3. Captures PPT ({completedSlidesCount}/{slidesCount})
                            </button>
                        </nav>

                        <div className="flex items-center gap-2">
                            {/* MAIN CTA TO GOOGLE SHEET */}
                            <a 
                                href={GOOGLE_SHEET_URL}
                                target="_blank"
                                rel="noopener noreferrer"
                                className="bg-emerald-600 hover:bg-emerald-700 text-white font-black text-xs px-4 py-2.5 rounded-2xl shadow-sm transition active-scale flex items-center gap-2 shrink-0"
                            >
                                <i className="fa-solid fa-table"></i>
                                <span>Ouvrir Google Sheet</span>
                                <i className="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                            </a>

                            <button 
                                onClick={resetAll}
                                className="w-9 h-9 rounded-2xl bg-slate-100 border border-slate-200 text-slate-600 flex items-center justify-center text-xs shadow-xs hover:bg-slate-200 transition active-scale shrink-0"
                                title="Réinitialiser les étapes"
                            >
                                <i className="fa-solid fa-arrow-rotate-left"></i>
                            </button>
                        </div>
                    </header>

                    {}
                    <div className="mb-6 bg-white border border-slate-200/80 rounded-3xl p-5 md:p-6 shadow-xs flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                        <div>
                            <div className="flex items-center gap-3">
                                <h2 className="text-xl md:text-2xl font-black text-slate-900 tracking-tight">
                                    Routine Data Matinale 📊
                                </h2>
                                <span className="text-xs font-bold bg-blue-50 text-cultura border border-blue-200 px-3 py-1 rounded-full">
                                    Semaine S-1
                                </span>
                            </div>
                            <p className="text-xs md:text-sm text-slate-500 font-semibold mt-1">
                                {currentDone} de {totalSteps} étapes validées aujourd'hui ({progressPercent}%)
                            </p>
                        </div>

                        {/* Progress Bar */}
                        <div className="w-full md:w-80">
                            <div className="flex justify-between text-xs font-bold text-slate-600 mb-1.5">
                                <span>Avancement global</span>
                                <span>{progressPercent}%</span>
                            </div>
                            <div className="w-full h-3 bg-slate-100 rounded-full overflow-hidden border border-slate-200/60">
                                <div 
                                    className="h-full bg-gradient-to-r from-cultura to-cultura-electric rounded-full transition-all duration-500"
                                    style={{ width: `${progressPercent}%` }}
                                ></div>
                            </div>
                        </div>
                    </div>

                    <main className="flex-1">

                        {}
                        {activeTab === 'tasks' && (
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-5">
                                {TASKS_DATA.map((task) => {
                                    const isDone = completedTasks[task.id];

                                    return (
                                        <div 
                                            key={task.id} 
                                            className={`rounded-3xl p-5 transition-all duration-200 border ${task.bgClass} shadow-sm flex flex-col justify-between ${isDone ? 'completed-card' : ''}`}
                                        >
                                            <div>
                                                {/* Header */}
                                                <div className="flex items-start justify-between gap-2 mb-3">
                                                    <div className="flex items-center gap-3">
                                                        <span className="text-2xl">{task.icon}</span>
                                                        <div>
                                                            <h3 className="text-sm md:text-base font-black text-slate-900 leading-snug">
                                                                {task.title}
                                                            </h3>
                                                            <p className="text-[11px] text-slate-700 font-bold mt-0.5">
                                                                📍 {task.targetInfo}
                                                            </p>
                                                        </div>
                                                    </div>

                                                    {/* Toggle Button */}
                                                    <button 
                                                        onClick={() => toggleTask(task.id)}
                                                        className={`w-8 h-8 rounded-full flex items-center justify-center transition-all shadow-sm active-scale shrink-0 ${
                                                            isDone 
                                                                ? 'bg-emerald-600 text-white' 
                                                                : 'bg-white text-slate-400 border border-slate-300 hover:border-slate-400'
                                                        }`}
                                                        title={isDone ? "Marquer à faire" : "Marquer comme fait"}
                                                    >
                                                        <i className={`fa-solid ${isDone ? 'fa-check text-xs' : 'fa-circle text-[8px]'}`}></i>
                                                    </button>
                                                </div>

                                                {/* Steps Detail */}
                                                <div className="bg-white/90 backdrop-blur-xs rounded-2xl p-3.5 border border-white/80 mb-3 text-xs space-y-2 shadow-xs">
                                                    <span className="text-[10px] font-black tracking-wider uppercase text-slate-400 block mb-1">
                                                        Étapes à exécuter :
                                                    </span>
                                                    {task.steps.map((step, sIdx) => (
                                                        <div key={sIdx} className="flex items-start gap-2 text-slate-700 leading-relaxed font-semibold">
                                                            <span className="w-4 h-4 rounded-full bg-slate-100 text-slate-600 font-bold text-[10px] flex items-center justify-center shrink-0 mt-0.5">
                                                                {sIdx + 1}
                                                            </span>
                                                            <span>{step}</span>
                                                        </div>
                                                    ))}
                                                </div>

                                                {/* Vivlio Credentials */}
                                                {task.credentials && (
                                                    <div className="bg-white border border-sky-200 rounded-2xl p-3 mb-3 flex items-center justify-between gap-2 shadow-xs">
                                                        <div className="text-[11px] font-mono font-bold text-slate-800 truncate">
                                                            🔑 {task.credentials.user} / {task.credentials.pass}
                                                        </div>
                                                        <button 
                                                            onClick={() => copyText(`${task.credentials.user} / ${task.credentials.pass}`, 'Identifiants Vivlio')}
                                                            className="px-3 py-1 bg-sky-600 hover:bg-sky-700 text-white rounded-xl text-[10px] font-bold active-scale shrink-0 transition"
                                                        >
                                                            Copier
                                                        </button>
                                                    </div>
                                                )}
                                            </div>

                                            {/* Action Bar at bottom of card */}
                                            <div className="pt-2 border-t border-slate-900/5 flex items-center justify-between gap-2 mt-2">
                                                {task.link ? (
                                                    <a 
                                                        href={task.link}
                                                        target="_blank"
                                                        rel="noopener noreferrer"
                                                        className="inline-flex items-center gap-1.5 text-xs font-black text-cultura hover:text-cultura-electric bg-white/90 px-3.5 py-2 rounded-xl border border-white/80 active-scale transition shadow-xs"
                                                    >
                                                        <span>Accéder à la source</span>
                                                        <i className="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                                                    </a>
                                                ) : (
                                                    <span className="text-[11px] font-bold text-slate-500 italic px-2">Accès direct dans l'application</span>
                                                )}

                                                <button
                                                    onClick={() => toggleTask(task.id)}
                                                    className={`px-3.5 py-2 rounded-xl text-xs font-bold transition active-scale flex items-center gap-1.5 ${
                                                        isDone 
                                                            ? 'bg-emerald-100 text-emerald-800' 
                                                            : 'bg-white text-slate-700 hover:bg-slate-100 border border-slate-200'
                                                    }`}
                                                >
                                                    <span>{isDone ? 'Reporté ✅' : 'Marquer reporté'}</span>
                                                </button>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        )}

                        {}
                        {activeTab === 'looker' && (
                            <div className="max-w-3xl mx-auto bg-white border border-slate-200/80 rounded-3xl p-6 md:p-8 shadow-xs space-y-5">
                                <div className="flex items-center gap-4">
                                    <span className="text-3xl bg-blue-50 p-3 rounded-2xl">🔍</span>
                                    <div>
                                        <h3 className="text-lg font-black text-slate-900">Vérification Looker Studio</h3>
                                        <p className="text-xs md:text-sm text-slate-500 font-medium">Contrôler que toutes les données saisies sont bien remontées</p>
                                    </div>
                                </div>

                                <p className="text-xs md:text-sm text-slate-600 leading-relaxed font-medium bg-slate-50 p-4 rounded-2xl border border-slate-100">
                                    Une fois que les données de la semaine S-1 ont été correctement reportées dans le Google Sheet, ouvrez le rapport Looker Studio pour vérifier leur affichage global.
                                </p>

                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
                                    <a 
                                        href="https://datastudio.google.com/u/0/reporting/6d2c8c2d-cbea-42db-a4e4-0e569f8d3ad3/page/p_7r97ownj8c"
                                        target="_blank"
                                        rel="noopener noreferrer"
                                        className="py-3.5 px-4 bg-cultura hover:bg-cultura-dark text-white font-black rounded-2xl text-xs transition text-center shadow-xs flex items-center justify-center gap-2 active-scale"
                                    >
                                        <span>Ouvrir Looker Studio</span>
                                        <i className="fa-solid fa-arrow-up-right-from-square"></i>
                                    </a>

                                    <button
                                        onClick={() => setLookerVerified(!lookerVerified)}
                                        className={`py-3.5 px-4 rounded-2xl text-xs font-black transition flex items-center justify-center gap-2 border active-scale ${
                                            lookerVerified 
                                                ? 'bg-emerald-50 border-emerald-200 text-emerald-700' 
                                                : 'bg-slate-50 border-slate-200 text-slate-700 hover:bg-slate-100'
                                        }`}
                                    >
                                        <i className={`fa-solid ${lookerVerified ? 'fa-circle-check text-emerald-600' : 'fa-circle'}`}></i>
                                        <span>{lookerVerified ? 'Remontée validée ✅' : 'Valider la vérification'}</span>
                                    </button>
                                </div>
                            </div>
                        )}

                        {}
                        {activeTab === 'ppt' && (
                            <div className="space-y-4">
                                <div className="text-xs md:text-sm font-extrabold text-slate-600 px-1">
                                    Captures d'écran Looker Studio à insérer dans le PPT Weekly :
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                    {LOOKER_SLIDES.map((slide) => {
                                        const isDone = slidesDone[slide.id];
                                        return (
                                            <div 
                                                key={slide.id}
                                                onClick={() => toggleSlide(slide.id)}
                                                className={`rounded-3xl p-5 transition-all cursor-pointer border flex items-center justify-between gap-3 shadow-xs active-scale ${
                                                    isDone 
                                                        ? 'bg-emerald-50 border-emerald-200' 
                                                        : 'bg-white border-slate-200/90 hover:border-slate-300'
                                                }`}
                                            >
                                                <div className="flex items-center gap-3.5">
                                                    <span className="text-2xl bg-slate-50 p-2.5 rounded-2xl">{slide.icon}</span>
                                                    <div>
                                                        <h4 className={`text-xs md:text-sm font-black ${isDone ? 'line-through text-slate-400' : 'text-slate-900'}`}>
                                                            {slide.label}
                                                        </h4>
                                                        <p className="text-[11px] text-slate-500 font-medium">{slide.desc}</p>
                                                    </div>
                                                </div>

                                                <div className={`w-8 h-8 rounded-full flex items-center justify-center text-xs shrink-0 ${
                                                    isDone ? 'bg-emerald-500 text-white' : 'border-2 border-slate-300 text-transparent'
                                                }`}>
                                                    <i className="fa-solid fa-check"></i>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                    </main>

                    {}
                    {toast && (
                        <div className="fixed top-6 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white text-xs font-bold px-5 py-3 rounded-full shadow-2xl flex items-center gap-2.5 border border-slate-700">
                            <i className="fa-solid fa-circle-check text-emerald-400"></i>
                            <span>{toast}</span>
                        </div>
                    )}

                    {}
                    <nav className="fixed bottom-4 left-4 right-4 max-w-md mx-auto glass-dock border border-slate-200/80 rounded-full z-40 p-1.5 shadow-lg md:hidden">
                        <div className="flex items-center justify-around">
                            <button 
                                onClick={() => setActiveTab('tasks')}
                                className={`flex flex-col items-center gap-0.5 py-1.5 px-4 rounded-full transition ${
                                    activeTab === 'tasks' ? 'text-cultura font-black' : 'text-slate-400 hover:text-slate-600'
                                }`}
                            >
                                <i className="fa-solid fa-list-check text-sm"></i>
                                <span className="text-[10px]">Guide & Liens</span>
                            </button>

                            <button 
                                onClick={() => setActiveTab('looker')}
                                className={`flex flex-col items-center gap-0.5 py-1.5 px-4 rounded-full transition ${
                                    activeTab === 'looker' ? 'text-cultura font-black' : 'text-slate-400 hover:text-slate-600'
                                }`}
                            >
                                <i className="fa-solid fa-chart-line text-sm"></i>
                                <span className="text-[10px]">Looker</span>
                            </button>

                            <button 
                                onClick={() => setActiveTab('ppt')}
                                className={`flex flex-col items-center gap-0.5 py-1.5 px-4 rounded-full transition ${
                                    activeTab === 'ppt' ? 'text-cultura font-black' : 'text-slate-400 hover:text-slate-600'
                                }`}
                            >
                                <i className="fa-solid fa-file-powerpoint text-sm"></i>
                                <span className="text-[10px]">Captures PPT</span>
                            </button>
                        </div>
                    </nav>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
