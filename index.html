<!DOCTYPE html>
<html lang="fr" class="h-full bg-[#F7F8FB] text-slate-900 antialiased selection:bg-[#0066FF] selection:text-white">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Cultura — Compagnon Routine Data</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel standalone -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Plus Jakarta Sans & Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cultura: {
                            DEFAULT: '#005088',
                            electric: '#0066FF',
                            light: '#EEF4FF',
                            border: '#D0E1FF',
                            dark: '#003358',
                        }
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
                    },
                    borderRadius: {
                        'card': '20px',
                        'inner': '12px',
                        'ctrl': '10px',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
            background-color: #F7F8FB;
            color: #334155;
        }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 99px; }

        .active-scale {
            transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.15s ease, border-color 0.15s ease;
        }
        .active-scale:active {
            transform: scale(0.98);
        }

        .glass-dock {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .shadow-card {
            box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 1px 3px rgba(15, 23, 42, 0.03);
        }
        .shadow-raised {
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.06);
        }

        .tnum { font-variant-numeric: tabular-nums; }

        a:focus-visible,
        button:focus-visible {
            outline: 3px solid #0066FF;
            outline-offset: 2px;
            border-radius: 10px;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body class="h-full pb-24 text-slate-700">
    <div id="root" class="min-h-full flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        /* =========================================================
           CONFIGURATION
           ========================================================= */

        const GOOGLE_SHEET_URL = "https://docs.google.com/spreadsheets/d/1HHj0tBer-Jdzy1E5RzwUveLguDSXxyQkPysB4J323J4/edit?gid=2117605739#gid=2117605739";

        // 'day' = remise à zéro chaque jour à minuit
        // 'week' = remise à zéro chaque lundi
        const RESET_MODE = 'day';

        const MAINTAINER = "Mickael";
        const MAINTAINER_CONTACT = "Teams";
        const LAST_UPDATE = "24/08/2026";

        const STORAGE_KEY = 'cultura_companion_v2';

        /* ========================================================= */

        // Réorganise l'ordre des éléments dans ce tableau si besoin
        const TASKS_DATA = [
            {
                id: 'location',
                title: 'Location',
                targetInfo: 'Prix Total HT (S-1)',
                icon: 'fa-box',
                accent: '#0066FF',
                link: 'https://location.cultura.com/admin/transactions',
                steps: [
                    'Ouvrir l\'administration des transactions Location',
                    'Exporter la plage de la semaine passée (S-1) au format CSV',
                    'Récupérer le Prix Total HT et le reporter dans le Sheet'
                ]
            },
            {
                id: 'pbi_ca_ent',
                title: 'Power BI — CA Enterprise',
                targetInfo: 'Chiffre d\'affaires CA Enterprise (S-1)',
                icon: 'fa-chart-column',
                accent: '#E8543A',
                link: 'https://app.fabric.microsoft.com/groups/me/apps/b57ba65b-c24e-4f5f-a67e-2bba90887f9e/reports/c75c6996-8d0a-411c-ae36-642bf2cad328/55b11de6da5c4b1c9667?ctid=37ddb62e-1d49-42b1-aacc-e08f83d1253d&redirectedFromSignup=1,1&experience=power-bi',
                steps: [
                    'Sélecteur VA Dynamique ➔ mettre sur "Tout" partout',
                    'Filtrer sur la période Semaine Passée (S-1)',
                    'Noter le chiffre d\'affaires CA Enterprise dans le Sheet'
                ]
            },
            {
                id: 'pbi_marge_web',
                title: 'Power BI — Marge Web',
                targetInfo: 'Pourcentage de marge Web (S-1)',
                icon: 'fa-laptop',
                accent: '#7C4DEB',
                link: 'https://app.fabric.microsoft.com/groups/me/apps/b57ba65b-c24e-4f5f-a67e-2bba90887f9e/reports/c75c6996-8d0a-411c-ae36-642bf2cad328/55b11de6da5c4b1c9667?ctid=37ddb62e-1d49-42b1-aacc-e08f83d1253d&redirectedFromSignup=1,1&experience=power-bi',
                steps: [
                    'Canal de vente ➔ sélectionner "Web"',
                    'CEC ➔ sélectionner "B2C"',
                    'Reporter le % de marge Web S-1 dans le Sheet'
                ]
            },
            {
                id: 'pbi_ecom_ccw',
                title: 'Power BI — CA Ecom CCW',
                targetInfo: 'Expédié : Total (Ecom + CCW) (S-1)',
                icon: 'fa-truck',
                accent: '#D97706',
                link: 'https://app.fabric.microsoft.com/groups/me/apps/0c040b49-d730-4047-ba7c-65b8937b0fb2/reports/07e1b5f9-2cc9-4093-bc18-2f3bdf4c4491/404d3ead94a78681c7b5?experience=fabric-developer',
                steps: [
                    'Accéder au rapport Power BI Ecom & CCW',
                    'Se positionner sur l\'onglet "Expédié"',
                    'Reporter le Total (Ecom + CCW) pour S-1 dans le Sheet'
                ]
            },
            {
                id: 'marketplace',
                title: 'Marketplace',
                targetInfo: 'Données Marketplace — ligne 7',
                icon: 'fa-store',
                accent: '#0D9488',
                link: 'https://cultura365.sharepoint.com/:x:/s/Marketplace/EQ-yjtSHyylAkh8C4EqYoHgBqUnmG-xDbX841U4qRbHJWg?e=fCFja0',
                steps: [
                    'Ouvrir le fichier SharePoint Marketplace',
                    'Vérifier que l\'équipe a mis à jour la semaine (ligne 7)',
                    'Si du retard est constaté ➔ relancer l\'équipe Marketplace sur Teams'
                ]
            },
            {
                id: 'vivlio',
                title: 'Ebook Vivlio',
                targetInfo: 'Partie bleue du graphique camembert',
                icon: 'fa-book-open',
                accent: '#0284C7',
                accessNote: 'Identifiants Vivlio : voir DM Teams',
                steps: [
                    'Se connecter à l\'espace Vivlio (identifiants transmis en DM Teams)',
                    'Consulter le camembert de répartition',
                    'Prendre la valeur de la partie bleue et la mettre dans le Sheet'
                ]
            },
            {
                id: 'magasin',
                title: 'Magasin — Taux de transformation',
                targetInfo: 'Taux de transformation magasin (S-1)',
                icon: 'fa-shop',
                accent: '#DB2777',
                link: 'https://hub.cultura.intra/portal/auth/portal/hub/Commerce/Indicateurs+commerciaux/Taux+de+transformation',
                requiresVpn: true,
                steps: [
                    'Accéder à l\'intranet Hub Cultura',
                    'Sélectionner la bonne semaine (S-1)',
                    'Copier le taux de transformation magasin dans le Sheet'
                ]
            }
        ];

        const LOOKER_SLIDES = [
            { id: 's1', label: 'Slide Obj sources', desc: 'Objectifs et sources de trafic', icon: 'fa-bullseye' },
            { id: 's2', label: 'Trafic métier', desc: 'Sessions et fréquentation', icon: 'fa-arrow-trend-up' },
            { id: 's3', label: 'V2.1 SD+ Vivlio', desc: 'Synthèse V2.1 SD+ et Vivlio', icon: 'fa-book' },
            { id: 's4', label: 'Commandé', desc: 'Vue ventes commandées', icon: 'fa-cart-shopping' },
            { id: 's5', label: 'Expédié', desc: 'Vue ventes expédiées', icon: 'fa-boxes-stacked' },
        ];

        /* ---------- Gestion de la période ---------- */

        function getPeriodKey() {
            const now = new Date();

            if (RESET_MODE === 'day') {
                const y = now.getFullYear();
                const m = String(now.getMonth() + 1).padStart(2, '0');
                const d = String(now.getDate()).padStart(2, '0');
                return `${y}-${m}-${d}`;
            }

            const d = new Date(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()));
            const dayNum = d.getUTCDay() || 7;
            d.setUTCDate(d.getUTCDate() + 4 - dayNum);
            const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
            const weekNo = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
            return `${d.getUTCFullYear()}-S${String(weekNo).padStart(2, '0')}`;
        }

        function getPeriodLabel() {
            const key = getPeriodKey();
            if (RESET_MODE === 'day') {
                return new Date().toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
            }
            return `Semaine ${key.split('-S')[1]} · ${key.split('-S')[0]}`;
        }

        const EMPTY_STATE = { tasks: {}, slides: {}, looker: false };

        function loadState() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return { ...EMPTY_STATE };
                const parsed = JSON.parse(raw);
                if (parsed.period !== getPeriodKey()) return { ...EMPTY_STATE };
                return {
                    tasks: parsed.tasks || {},
                    slides: parsed.slides || {},
                    looker: Boolean(parsed.looker)
                };
            } catch (e) {
                return { ...EMPTY_STATE };
            }
        }

        function saveState(state) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...state, period: getPeriodKey() }));
            } catch (e) {}
        }

        function App() {
            const [activeTab, setActiveTab] = useState('tasks');
            const [state, setState] = useState(loadState);
            const [toast, setToast] = useState(null);
            const [showResetModal, setShowResetModal] = useState(false);
            const toastTimer = useRef(null);

            const { tasks: completedTasks, slides: slidesDone, looker: lookerVerified } = state;

            useEffect(() => { saveState(state); }, [state]);

            useEffect(() => {
                const onVisible = () => {
                    if (document.visibilityState === 'visible') setState(loadState());
                };
                document.addEventListener('visibilitychange', onVisible);
                return () => document.removeEventListener('visibilitychange', onVisible);
            }, []);

            useEffect(() => () => clearTimeout(toastTimer.current), []);

            const showToast = (msg) => {
                clearTimeout(toastTimer.current);
                setToast(msg);
                toastTimer.current = setTimeout(() => setToast(null), 2500);
            };

            const taskCount = TASKS_DATA.length;
            const completedTaskCount = Object.values(completedTasks).filter(Boolean).length;
            const slidesCount = LOOKER_SLIDES.length;
            const completedSlidesCount = Object.values(slidesDone).filter(Boolean).length;

            const totalSteps = taskCount + 1 + slidesCount;
            const currentDone = completedTaskCount + (lookerVerified ? 1 : 0) + completedSlidesCount;
            const progressPercent = Math.round((currentDone / totalSteps) * 100);

            const toggleTask = (id) => {
                setState(prev => ({ ...prev, tasks: { ...prev.tasks, [id]: !prev.tasks[id] } }));
            };

            const toggleSlide = (id) => {
                setState(prev => ({ ...prev, slides: { ...prev.slides, [id]: !prev.slides[id] } }));
            };

            const setLookerVerified = (val) => {
                setState(prev => ({ ...prev, looker: val }));
            };

            const resetAll = () => {
                setState({ ...EMPTY_STATE });
                setShowResetModal(false);
                showToast("Progression réinitialisée");
            };

            const tabs = [
                { id: 'tasks',  icon: 'fa-list-check',     short: 'Relevés', long: 'Relevés',      badge: `${completedTaskCount}/${taskCount}` },
                { id: 'looker', icon: 'fa-magnifying-glass-chart', short: 'Looker',  long: 'Looker Studio', badge: null, check: lookerVerified },
                { id: 'ppt',    icon: 'fa-file-powerpoint', short: 'Captures', long: 'Captures PPT', badge: `${completedSlidesCount}/${slidesCount}` },
            ];

            return (
                <div className="flex-1 flex flex-col max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 pt-5 pb-28 md:pb-12">

                    {/* HEADER */}
                    <header className="flex items-center justify-between gap-3 mb-5 bg-white px-4 py-3 rounded-card border border-slate-200 shadow-card">
                        <div className="flex items-center gap-3">
                            <div className="w-9 h-9 rounded-inner bg-cultura text-white flex items-center justify-center font-bold text-base shrink-0">
                                C
                            </div>
                            <div>
                                <h1 className="text-[15px] font-bold text-slate-900 leading-tight">
                                    Compagnon Data
                                </h1>
                                <p className="text-[13px] text-slate-500 leading-tight mt-0.5">
                                    Aide au remplissage du Google Sheet
                                </p>
                            </div>
                        </div>

                        {/* ONGLETS DESKTOP */}
                        <nav className="hidden md:flex items-center gap-1 bg-slate-100 p-1 rounded-full border border-slate-200/70">
                            {tabs.map((tab, i) => (
                                <button
                                    key={tab.id}
                                    onClick={() => setActiveTab(tab.id)}
                                    aria-current={activeTab === tab.id ? 'page' : undefined}
                                    className={`px-3.5 py-1.5 rounded-full text-[13px] transition active-scale flex items-center gap-2 ${
                                        activeTab === tab.id
                                            ? 'bg-white text-cultura font-semibold shadow-card'
                                            : 'text-slate-500 font-medium hover:text-slate-800'
                                    }`}
                                >
                                    <span className="tnum text-[11px] text-slate-500 font-medium">{i + 1}</span>
                                    <i className={`fa-solid ${tab.icon} text-[13px]`}></i>
                                    <span>{tab.long}</span>
                                    {tab.badge && (
                                        <span className="tnum text-[11px] text-slate-500 font-medium">{tab.badge}</span>
                                    )}
                                    {tab.check && <i className="fa-solid fa-circle-check text-emerald-500 text-[12px]"></i>}
                                </button>
                            ))}
                        </nav>

                        <a
                            href={GOOGLE_SHEET_URL}
                            target="_blank"
                            rel="noopener noreferrer"
                            className="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-[13px] px-4 py-2.5 rounded-ctrl transition active-scale flex items-center gap-2 shrink-0"
                        >
                            <i className="fa-solid fa-table-cells text-[12px]"></i>
                            <span className="hidden sm:inline">Ouvrir le Google Sheet</span>
                            <span className="sm:hidden">Sheet</span>
                        </a>
                    </header>

                    {/* PROGRESSION */}
                    <section className="mb-6 bg-white border border-slate-200 rounded-card px-5 py-5 md:px-6 shadow-card flex flex-col md:flex-row md:items-end md:justify-between gap-5">
                        <div>
                            <p className="text-[11px] font-semibold uppercase tracking-[0.08em] text-slate-500 mb-1.5 capitalize">
                                {getPeriodLabel()}
                            </p>
                            <div className="flex flex-wrap items-center gap-2.5">
                                <h2 className="text-2xl md:text-[28px] font-extrabold text-slate-900 tracking-tight leading-none">
                                    Relevés quotidiens
                                </h2>
                                <span className="text-[12px] font-semibold text-cultura bg-cultura-light border border-cultura-border px-2.5 py-1 rounded-full">
                                    Données S-1
                                </span>
                            </div>
                            <p className="text-[13px] text-slate-500 mt-2">
                                <span className="tnum font-semibold text-slate-700">{currentDone}</span> sur <span className="tnum">{totalSteps}</span> étapes validées.
                                Remise à zéro automatique chaque jour.
                            </p>
                        </div>

                        <div className="w-full md:w-72 shrink-0">
                            <div className="flex justify-between items-baseline mb-2">
                                <span className="text-[13px] text-slate-500">Avancement</span>
                                <span className="tnum text-lg font-bold text-slate-900">{progressPercent}%</span>
                            </div>
                            <div
                                className="w-full h-2 bg-slate-100 rounded-full overflow-hidden"
                                role="progressbar"
                                aria-valuenow={progressPercent}
                                aria-valuemin="0"
                                aria-valuemax="100"
                                aria-label="Avancement global de la routine"
                            >
                                <div
                                    className="h-full bg-gradient-to-r from-cultura to-cultura-electric rounded-full transition-all duration-500"
                                    style={{ width: `${progressPercent}%` }}
                                ></div>
                            </div>
                        </div>
                    </section>

                    <main className="flex-1">

                        {/* ONGLET 1 : RELEVES */}
                        {activeTab === 'tasks' && (
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                {TASKS_DATA.map((task, index) => {
                                    const isDone = completedTasks[task.id];

                                    return (
                                        <article
                                            key={task.id}
                                            className={`rounded-card border border-slate-200 p-5 flex flex-col justify-between transition-colors duration-200 shadow-card ${
                                                isDone ? 'bg-emerald-50/40' : 'bg-white'
                                            }`}
                                        >
                                            <div>
                                                {/* En-tête de carte */}
                                                <div className="flex items-start justify-between gap-3 mb-4">
                                                    <div className="flex items-start gap-3 min-w-0">
                                                        <div
                                                            className="w-9 h-9 rounded-inner flex items-center justify-center shrink-0 text-[14px]"
                                                            style={{
                                                                backgroundColor: isDone ? '#D1FAE5' : task.accent + '14',
                                                                color: isDone ? '#047857' : task.accent
                                                            }}
                                                        >
                                                            <i className={`fa-solid ${task.icon}`}></i>
                                                        </div>
                                                        <div className="min-w-0">
                                                            <span className="tnum text-[11px] font-semibold text-slate-500 tracking-[0.08em] block leading-none mb-1">
                                                                {String(index + 1).padStart(2, '0')}
                                                            </span>
                                                            <h3 className={`text-[15px] font-bold leading-snug ${isDone ? 'text-slate-500' : 'text-slate-900'}`}>
                                                                {task.title}
                                                            </h3>
                                                            <p className="text-[13px] text-slate-500 mt-1 flex items-start gap-1.5">
                                                                <i className="fa-solid fa-location-dot text-[11px] mt-[3px] shrink-0 text-slate-400"></i>
                                                                <span>{task.targetInfo}</span>
                                                            </p>
                                                        </div>
                                                    </div>

                                                    {isDone && (
                                                        <span className="flex items-center gap-1.5 text-[12px] font-semibold text-emerald-700 bg-emerald-100 px-2.5 py-1 rounded-full shrink-0">
                                                            <i className="fa-solid fa-check text-[10px]"></i>
                                                            Reporté
                                                        </span>
                                                    )}
                                                </div>

                                                {/* Étapes */}
                                                <ol className="bg-slate-50 rounded-inner p-4 border border-slate-100 mb-3 space-y-2.5">
                                                    <li className="text-[11px] font-semibold tracking-[0.08em] uppercase text-slate-500 list-none">
                                                        Étapes
                                                    </li>
                                                    {task.steps.map((step, sIdx) => (
                                                        <li key={sIdx} className="flex items-start gap-2.5 text-[13px] text-slate-600 leading-relaxed list-none">
                                                            <span className="tnum w-[18px] h-[18px] rounded-full bg-white border border-slate-200 text-slate-500 font-semibold text-[11px] flex items-center justify-center shrink-0 mt-[2px]">
                                                                {sIdx + 1}
                                                            </span>
                                                            <span>{step}</span>
                                                        </li>
                                                    ))}
                                                </ol>

                                                {/* Notes d'accès */}
                                                {task.accessNote && (
                                                    <div className="rounded-inner border border-slate-200 bg-white px-3.5 py-2.5 mb-2.5 flex items-center gap-2.5">
                                                        <i className="fa-solid fa-key text-slate-400 text-[12px] shrink-0"></i>
                                                        <span className="text-[13px] text-slate-600">{task.accessNote}</span>
                                                    </div>
                                                )}

                                                {task.requiresVpn && (
                                                    <div className="rounded-inner border border-amber-200 bg-amber-50 px-3.5 py-2.5 mb-2.5 flex items-center gap-2.5">
                                                        <i className="fa-solid fa-shield-halved text-amber-600 text-[12px] shrink-0"></i>
                                                        <span className="text-[13px] text-amber-900">
                                                            Réseau interne ou VPN requis
                                                        </span>
                                                    </div>
                                                )}
                                            </div>

                                            {/* Actions */}
                                            <div className="pt-3.5 mt-1 border-t border-slate-100 flex items-center justify-between gap-2">
                                                {task.link ? (
                                                    <a
                                                        href={task.link}
                                                        target="_blank"
                                                        rel="noopener noreferrer"
                                                        className="inline-flex items-center gap-2 text-[13px] font-semibold text-cultura hover:text-cultura-electric transition active-scale"
                                                    >
                                                        <span>Accéder à la source</span>
                                                        <i className="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                                                    </a>
                                                ) : (
                                                    <span className="text-[13px] text-slate-500">Accès direct dans l'application</span>
                                                )}

                                                <button
                                                    onClick={() => toggleTask(task.id)}
                                                    aria-pressed={Boolean(isDone)}
                                                    className={`px-3.5 py-2 rounded-ctrl text-[13px] font-semibold transition active-scale flex items-center gap-2 border shrink-0 ${
                                                        isDone
                                                            ? 'bg-white text-slate-500 border-slate-200 hover:text-slate-700'
                                                            : 'bg-slate-900 text-white border-slate-900 hover:bg-slate-800'
                                                    }`}
                                                >
                                                    <i className={`fa-solid ${isDone ? 'fa-rotate-left' : 'fa-check'} text-[11px]`}></i>
                                                    <span>{isDone ? 'Annuler' : 'Marquer reporté'}</span>
                                                </button>
                                            </div>
                                        </article>
                                    );
                                })}
                            </div>
                        )}

                        {/* ONGLET 2 : LOOKER */}
                        {activeTab === 'looker' && (
                            <div className="max-w-2xl mx-auto bg-white border border-slate-200 rounded-card p-6 md:p-7 shadow-card space-y-5">
                                <div className="flex items-start gap-4">
                                    <div className="w-11 h-11 rounded-inner bg-cultura-light text-cultura flex items-center justify-center text-base shrink-0">
                                        <i className="fa-solid fa-magnifying-glass-chart"></i>
                                    </div>
                                    <div>
                                        <h3 className="text-[17px] font-bold text-slate-900 leading-snug">Vérification Looker Studio</h3>
                                        <p className="text-[13px] text-slate-500 mt-1">Contrôler que les données saisies remontent correctement</p>
                                    </div>
                                </div>

                                <p className="text-[14px] text-slate-600 leading-relaxed bg-slate-50 px-4 py-3.5 rounded-inner border border-slate-100">
                                    Une fois les données de la semaine S-1 reportées dans le Google Sheet, ouvrez le rapport Looker Studio pour vérifier leur affichage global.
                                </p>

                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                    <a
                                        href="https://datastudio.google.com/u/0/reporting/6d2c8c2d-cbea-42db-a4e4-0e569f8d3ad3/page/p_7r97ownj8c"
                                        target="_blank"
                                        rel="noopener noreferrer"
                                        className="py-3 px-4 bg-cultura hover:bg-cultura-dark text-white font-semibold rounded-ctrl text-[13px] transition text-center flex items-center justify-center gap-2 active-scale"
                                    >
                                        <span>Ouvrir Looker Studio</span>
                                        <i className="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                                    </a>

                                    <button
                                        onClick={() => setLookerVerified(!lookerVerified)}
                                        aria-pressed={Boolean(lookerVerified)}
                                        className={`py-3 px-4 rounded-ctrl text-[13px] font-semibold transition flex items-center justify-center gap-2 border active-scale ${
                                            lookerVerified
                                                ? 'bg-emerald-50 border-emerald-200 text-emerald-700'
                                                : 'bg-white border-slate-200 text-slate-700 hover:bg-slate-50'
                                        }`}
                                    >
                                        <i className={`fa-solid ${lookerVerified ? 'fa-circle-check text-emerald-600' : 'fa-circle text-slate-300'} text-[12px]`}></i>
                                        <span>{lookerVerified ? 'Remontée validée' : 'Valider la vérification'}</span>
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* ONGLET 3 : CAPTURES PPT */}
                        {activeTab === 'ppt' && (
                            <div className="space-y-4">
                                <p className="text-[13px] text-slate-500 px-0.5">
                                    Captures Looker Studio à insérer dans le PPT Weekly.
                                </p>

                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                    {LOOKER_SLIDES.map((slide) => {
                                        const isDone = slidesDone[slide.id];
                                        return (
                                            <button
                                                key={slide.id}
                                                onClick={() => toggleSlide(slide.id)}
                                                aria-pressed={Boolean(isDone)}
                                                className={`text-left w-full rounded-card p-4 transition-colors border flex items-center justify-between gap-3 shadow-card active-scale ${
                                                    isDone
                                                        ? 'bg-emerald-50/50 border-emerald-200'
                                                        : 'bg-white border-slate-200 hover:border-slate-300'
                                                }`}
                                            >
                                                <div className="flex items-center gap-3 min-w-0">
                                                    <div className={`w-9 h-9 rounded-inner flex items-center justify-center text-[14px] shrink-0 ${
                                                        isDone ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-500'
                                                    }`}>
                                                        <i className={`fa-solid ${slide.icon}`}></i>
                                                    </div>
                                                    <div className="min-w-0">
                                                        <h4 className={`text-[14px] font-bold leading-snug ${isDone ? 'text-slate-500' : 'text-slate-900'}`}>
                                                            {slide.label}
                                                        </h4>
                                                        <p className="text-[13px] text-slate-500 mt-0.5">{slide.desc}</p>
                                                    </div>
                                                </div>

                                                <div className={`w-6 h-6 rounded-full flex items-center justify-center text-[10px] shrink-0 ${
                                                    isDone ? 'bg-emerald-600 text-white' : 'border-2 border-slate-200 text-transparent'
                                                }`}>
                                                    <i className="fa-solid fa-check"></i>
                                                </div>
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                    </main>

                    {/* PIED DE PAGE */}
                    <footer className="mt-8 pt-5 border-t border-slate-200 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
                        <p className="text-[13px] text-slate-500">
                            Maintenu par {MAINTAINER} · Mise à jour du {LAST_UPDATE} · Lien mort ou étape à corriger ? Écrivez-lui sur {MAINTAINER_CONTACT}.
                        </p>
                        <button
                            onClick={() => setShowResetModal(true)}
                            className="text-[13px] font-medium text-slate-500 hover:text-slate-800 transition flex items-center gap-2 shrink-0 self-start sm:self-auto"
                        >
                            <i className="fa-solid fa-arrow-rotate-left text-[11px]"></i>
                            Réinitialiser la progression
                        </button>
                    </footer>

                    {/* TOAST */}
                    {toast && (
                        <div role="status" aria-live="polite" className="fixed top-6 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white text-[13px] font-medium px-4 py-2.5 rounded-ctrl shadow-raised flex items-center gap-2.5">
                            <i className="fa-solid fa-circle-check text-emerald-400 text-[12px]"></i>
                            <span>{toast}</span>
                        </div>
                    )}

                    {/* MODALE DE RÉINITIALISATION */}
                    {showResetModal && (
                        <div
                            className="fixed inset-0 z-50 bg-slate-900/40 flex items-center justify-center p-4"
                            onClick={() => setShowResetModal(false)}
                        >
                            <div
                                role="dialog"
                                aria-modal="true"
                                aria-label="Réinitialiser la progression"
                                className="bg-white rounded-card max-w-sm w-full p-6 space-y-3 shadow-raised"
                                onClick={(e) => e.stopPropagation()}
                            >
                                <div className="w-10 h-10 rounded-inner bg-red-50 text-red-600 flex items-center justify-center text-[15px]">
                                    <i className="fa-solid fa-triangle-exclamation"></i>
                                </div>
                                <h3 className="text-[16px] font-bold text-slate-900">Réinitialiser la progression ?</h3>
                                <p className="text-[13px] text-slate-500 leading-relaxed">
                                    Toutes les étapes cochées repasseront à faire. Les données déjà saisies dans le Google Sheet ne sont pas affectées.
                                </p>
                                <div className="flex items-center gap-2 pt-2">
                                    <button
                                        onClick={() => setShowResetModal(false)}
                                        className="flex-1 py-2.5 bg-white border border-slate-200 text-slate-700 font-semibold rounded-ctrl text-[13px] hover:bg-slate-50 transition"
                                    >
                                        Annuler
                                    </button>
                                    <button
                                        onClick={resetAll}
                                        className="flex-1 py-2.5 bg-red-600 hover:bg-red-700 text-white font-semibold rounded-ctrl text-[13px] transition"
                                    >
                                        Réinitialiser
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* DOCK MOBILE */}
                    <nav className="fixed bottom-4 left-4 right-4 max-w-sm mx-auto glass-dock border border-slate-200 rounded-full z-40 p-1.5 shadow-raised md:hidden">
                        <div className="flex items-center justify-around">
                            {tabs.map((tab) => (
                                <button
                                    key={tab.id}
                                    onClick={() => setActiveTab(tab.id)}
                                    aria-current={activeTab === tab.id ? 'page' : undefined}
                                    className={`flex flex-col items-center gap-1 py-1.5 px-5 rounded-full transition ${
                                        activeTab === tab.id ? 'text-cultura' : 'text-slate-500'
                                    }`}
                                >
                                    <i className={`fa-solid ${tab.icon} text-[15px]`}></i>
                                    <span className={`text-[11px] ${activeTab === tab.id ? 'font-semibold' : 'font-medium'}`}>
                                        {tab.short}
                                    </span>
                                </button>
                            ))}
                        </div>
                    </nav>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
