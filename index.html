<!DOCTYPE html>
<html lang="fr" class="h-full bg-[#F8FAFC] text-slate-800 antialiased selection:bg-[#0066FF] selection:text-white">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Cultura — Compagnon Routine Data</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel standalone -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cultura: {
                            DEFAULT: '#005088',
                            electric: '#0066FF',
                            light: '#EEF4FF',
                            border: '#D0E1FF',
                            dark: '#003358',
                        }
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    borderRadius: {
                        'bento': '22px',
                        'inner': '14px',
                        'ctrl': '12px',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
            background-color: #F8FAFC;
        }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 99px; }

        .active-scale {
            transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.15s ease, border-color 0.15s ease;
        }
        .active-scale:active {
            transform: scale(0.985);
        }

        .glass-dock {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .shadow-bento {
            box-shadow: 0 2px 8px -2px rgba(15, 23, 42, 0.04), 0 6px 20px -4px rgba(15, 23, 42, 0.03);
        }
        .shadow-bento-hover:hover {
            box-shadow: 0 4px 14px -2px rgba(15, 23, 42, 0.06), 0 12px 28px -4px rgba(15, 23, 42, 0.05);
        }

        .tnum { font-variant-numeric: tabular-nums; }

        a:focus-visible,
        button:focus-visible {
            outline: 2px solid #0066FF;
            outline-offset: 2px;
            border-radius: 12px;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body class="h-full pb-24 text-slate-700">
    <div id="root" class="min-h-full flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        /* =========================================================
           CONFIGURATION
           ========================================================= */

        const GOOGLE_SHEET_URL = "https://docs.google.com/spreadsheets/d/1HHj0tBer-Jdzy1E5RzwUveLguDSXxyQkPysB4J323J4/edit?gid=2117605739#gid=2117605739";
        const RESET_MODE = 'day';
        const MAINTAINER = "Mickael";
        const MAINTAINER_CONTACT = "Teams";
        const LAST_UPDATE = "24/08/2026";
        const STORAGE_KEY = 'cultura_companion_v3';

        // Liste des cartes du Bento (groupées par source pour l'étape 2 & 3)
        const SOURCE_GROUPS = [
            {
                groupId: 'src_pbi_ccw',
                sourceTitle: 'Power BI — Expédié & CCW',
                icon: 'fa-truck',
                accent: '#D97706',
                link: 'https://app.fabric.microsoft.com/groups/me/apps/0c040b49-d730-4047-ba7c-65b8937b0fb2/reports/07e1b5f9-2cc9-4093-bc18-2f3bdf4c4491/404d3ead94a78681c7b5?experience=fabric-developer',
                tasks: [
                    {
                        id: 'step_1_ecom_ccw',
                        stepNum: '1',
                        colTag: 'Colonne C',
                        title: 'Ecom CCW',
                        targetInfo: 'Expédié : Total (Ecom + CCW)',
                        steps: [
                            'Accéder au rapport Power BI Ecom & CCW',
                            'Se positionner sur l\'onglet "Expédié"',
                            'Reporter le Total (Ecom + CCW) pour S-1'
                        ]
                    }
                ]
            },
            {
                groupId: 'src_pbi_finance',
                sourceTitle: 'Power BI — CA Enterprise & Marge',
                sourceBadge: 'Source commune (2 relevés)',
                icon: 'fa-chart-pie',
                accent: '#7C4DEB',
                link: 'https://app.fabric.microsoft.com/groups/me/apps/b57ba65b-c24e-4f5f-a67e-2bba90887f9e/reports/c75c6996-8d0a-411c-ae36-642bf2cad328/55b11de6da5c4b1c9667?ctid=37ddb62e-1d49-42b1-aacc-e08f83d1253d&redirectedFromSignup=1,1&experience=power-bi',
                tasks: [
                    {
                        id: 'step_2_part_marge',
                        stepNum: '2',
                        colTag: 'Colonne F',
                        title: 'Part marge Web',
                        targetInfo: 'Pourcentage de marge Web B2C',
                        steps: [
                            'Canal de vente ➔ sélectionner "Web"',
                            'CEC ➔ sélectionner "B2C"',
                            'Reporter le % de marge Web S-1'
                        ]
                    },
                    {
                        id: 'step_3_ca_ent',
                        stepNum: '3',
                        colTag: 'Colonne G',
                        title: 'CA Entreprise',
                        targetInfo: 'Chiffre d\'affaires CA Enterprise',
                        steps: [
                            'Sélecteur VA Dynamique ➔ mettre sur "Tout" partout',
                            'Filtrer sur la période Semaine Passée (S-1)',
                            'Noter le CA Enterprise dans le Sheet'
                        ]
                    }
                ]
            },
            {
                groupId: 'src_mkp',
                sourceTitle: 'SharePoint Marketplace',
                icon: 'fa-store',
                accent: '#0D9488',
                link: 'https://cultura365.sharepoint.com/:x:/s/Marketplace/EQ-yjtSHyylAkh8C4EqYoHgBqUnmG-xDbX841U4qRbHJWg?e=fCFja0',
                tasks: [
                    {
                        id: 'step_4_ca_mkp',
                        stepNum: '4',
                        colTag: 'Colonne M',
                        title: 'CA MKP',
                        targetInfo: 'Données Marketplace — ligne 7',
                        steps: [
                            'Ouvrir le fichier SharePoint Marketplace',
                            'Vérifier la mise à jour de la semaine (ligne 7)',
                            'Si retard constaté ➔ relancer l\'équipe MKP sur Teams'
                        ]
                    }
                ]
            },
            {
                groupId: 'src_location',
                sourceTitle: 'Admin Location',
                icon: 'fa-box',
                accent: '#0066FF',
                link: 'https://location.cultura.com/admin/transactions',
                tasks: [
                    {
                        id: 'step_5_ca_loc',
                        stepNum: '5',
                        colTag: 'Colonne N',
                        title: 'CA Location',
                        targetInfo: 'Prix Total HT (S-1)',
                        steps: [
                            'Ouvrir l\'admin des transactions Location',
                            'Exporter la plage S-1 au format CSV',
                            'Reporter le Prix Total HT dans le Sheet'
                        ]
                    }
                ]
            },
            {
                groupId: 'src_vivlio',
                sourceTitle: 'Portail Vivlio',
                icon: 'fa-book-open',
                accent: '#0284C7',
                accessNote: 'Identifiants Vivlio : voir DM Teams',
                tasks: [
                    {
                        id: 'step_6_vivlio',
                        stepNum: '6',
                        colTag: 'Colonne P',
                        title: 'Ebook Vivlio',
                        targetInfo: 'Partie bleue du graphique camembert',
                        steps: [
                            'Se connecter à l\'espace Vivlio',
                            'Consulter le camembert de répartition',
                            'Prendre la valeur bleue et l\'ajouter au Sheet'
                        ]
                    }
                ]
            }
        ];

        const LOOKER_SLIDES = [
            { id: 's1', label: 'Slide Obj sources', desc: 'Objectifs et sources de trafic', icon: 'fa-bullseye' },
            { id: 's2', label: 'Trafic métier', desc: 'Sessions et fréquentation', icon: 'fa-arrow-trend-up' },
            { id: 's3', label: 'V2.1 SD+ Vivlio', desc: 'Synthèse V2.1 SD+ et Vivlio', icon: 'fa-book' },
            { id: 's4', label: 'Commandé', desc: 'Vue ventes commandées', icon: 'fa-cart-shopping' },
            { id: 's5', label: 'Expédié', desc: 'Vue ventes expédiées', icon: 'fa-boxes-stacked' },
        ];

        // Calcul à plat de la liste des 6 tâches
        const ALL_TASK_IDS = SOURCE_GROUPS.flatMap(g => g.tasks.map(t => t.id));

        function getPeriodKey() {
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function getPeriodLabel() {
            return new Date().toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
        }

        const EMPTY_STATE = { tasks: {}, slides: {}, looker: false };

        function loadState() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return { ...EMPTY_STATE };
                const parsed = JSON.parse(raw);
                if (parsed.period !== getPeriodKey()) return { ...EMPTY_STATE };
                return {
                    tasks: parsed.tasks || {},
                    slides: parsed.slides || {},
                    looker: Boolean(parsed.looker)
                };
            } catch (e) {
                return { ...EMPTY_STATE };
            }
        }

        function saveState(state) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...state, period: getPeriodKey() }));
            } catch (e) {}
        }

        function App() {
            const [activeTab, setActiveTab] = useState('tasks');
            const [state, setState] = useState(loadState);
            const [toast, setToast] = useState(null);
            const [showResetModal, setShowResetModal] = useState(false);
            const [expandedTaskId, setExpandedTaskId] = useState(null);
            const toastTimer = useRef(null);

            const { tasks: completedTasks, slides: slidesDone, looker: lookerVerified } = state;

            useEffect(() => { saveState(state); }, [state]);

            useEffect(() => {
                const onVisible = () => {
                    if (document.visibilityState === 'visible') setState(loadState());
                };
                document.addEventListener('visibilitychange', onVisible);
                return () => document.removeEventListener('visibilitychange', onVisible);
            }, []);

            useEffect(() => () => clearTimeout(toastTimer.current), []);

            const showToast = (msg) => {
                clearTimeout(toastTimer.current);
                setToast(msg);
                toastTimer.current = setTimeout(() => setToast(null), 2500);
            };

            const taskCount = ALL_TASK_IDS.length; // 6
            const completedTaskCount = Object.values(completedTasks).filter(Boolean).length;
            const slidesCount = LOOKER_SLIDES.length;
            const completedSlidesCount = Object.values(slidesDone).filter(Boolean).length;

            const totalSteps = taskCount + 1 + slidesCount;
            const currentDone = completedTaskCount + (lookerVerified ? 1 : 0) + completedSlidesCount;
            const progressPercent = Math.round((currentDone / totalSteps) * 100);

            const toggleTask = (id) => {
                setState(prev => ({ ...prev, tasks: { ...prev.tasks, [id]: !prev.tasks[id] } }));
            };

            const toggleSlide = (id) => {
                setState(prev => ({ ...prev, slides: { ...prev.slides, [id]: !prev.slides[id] } }));
            };

            const setLookerVerified = (val) => {
                setState(prev => ({ ...prev, looker: val }));
            };

            const resetAll = () => {
                setState({ ...EMPTY_STATE });
                setShowResetModal(false);
                showToast("Progression réinitialisée");
            };

            const toggleExpand = (id) => {
                setExpandedTaskId(prev => prev === id ? null : id);
            };

            const tabs = [
                { id: 'tasks',  icon: 'fa-list-check',     short: 'Relevés', long: 'Relevés',      badge: `${completedTaskCount}/${taskCount}` },
                { id: 'looker', icon: 'fa-magnifying-glass-chart', short: 'Looker',  long: 'Looker Studio', badge: null, check: lookerVerified },
                { id: 'ppt',    icon: 'fa-file-powerpoint', short: 'Captures', long: 'Captures PPT', badge: `${completedSlidesCount}/${slidesCount}` },
            ];

            return (
                <div className="flex-1 flex flex-col max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 pt-6 pb-28 md:pb-12">

                    {/* HEADER */}
                    <header className="flex items-center justify-between gap-4 mb-6 bg-white/95 backdrop-blur border border-slate-200/80 px-5 py-3.5 rounded-bento shadow-bento">
                        <div className="flex items-center gap-3.5">
                            <div className="w-10 h-10 rounded-inner bg-cultura text-white flex items-center justify-center font-bold text-lg shadow-sm shrink-0">
                                C
                            </div>
                            <div>
                                <h1 className="text-[15px] font-bold text-slate-900 leading-none">
                                    Compagnon Data
                                </h1>
                                <p className="text-[12px] text-slate-500 font-medium mt-1">
                                    Aide à la saisie hebdo
                                </p>
                            </div>
                        </div>

                        {/* TABS */}
                        <nav className="hidden md:flex items-center gap-1.5 bg-slate-100/90 p-1.5 rounded-full border border-slate-200/60">
                            {tabs.map((tab, i) => (
                                <button
                                    key={tab.id}
                                    onClick={() => setActiveTab(tab.id)}
                                    aria-current={activeTab === tab.id ? 'page' : undefined}
                                    className={`px-4 py-2 rounded-full text-[13px] transition active-scale flex items-center gap-2 ${
                                        activeTab === tab.id
                                            ? 'bg-white text-cultura font-bold shadow-sm'
                                            : 'text-slate-600 font-medium hover:text-slate-900'
                                    }`}
                                >
                                    <span className="tnum text-[11px] opacity-60 font-semibold">{i + 1}</span>
                                    <i className={`fa-solid ${tab.icon} text-[12px]`}></i>
                                    <span>{tab.long}</span>
                                    {tab.badge && (
                                        <span className="tnum text-[11px] bg-slate-200/60 px-2 py-0.5 rounded-full text-slate-700 font-semibold">{tab.badge}</span>
                                    )}
                                    {tab.check && <i className="fa-solid fa-circle-check text-emerald-500 text-[12px]"></i>}
                                </button>
                            ))}
                        </nav>

                        <a
                            href={GOOGLE_SHEET_URL}
                            target="_blank"
                            rel="noopener noreferrer"
                            className="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-[13px] px-4 py-2.5 rounded-ctrl transition active-scale flex items-center gap-2 shrink-0 shadow-sm"
                        >
                            <i className="fa-solid fa-table-cells text-[12px]"></i>
                            <span className="hidden sm:inline">Google Sheet</span>
                        </a>
                    </header>

                    {/* BENTO STATUT */}
                    <section className="mb-6 grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div className="md:col-span-2 bg-gradient-to-br from-white via-white to-slate-50/70 border border-slate-200/80 rounded-bento p-6 shadow-bento flex flex-col justify-between">
                            <div className="flex items-center justify-between gap-3 mb-4">
                                <span className="text-[11px] font-bold uppercase tracking-[0.1em] text-cultura-electric bg-cultura-light border border-cultura-border px-3 py-1 rounded-full capitalize">
                                    {getPeriodLabel()}
                                </span>
                                <span className="text-[12px] font-semibold text-slate-500 bg-slate-100 px-3 py-1 rounded-full">
                                    Données S-1
                                </span>
                            </div>
                            <div>
                                <h2 className="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight leading-tight">
                                    Relevés ordonnés par colonne
                                </h2>
                                <p className="text-[13px] text-slate-600 mt-1.5 leading-relaxed">
                                    <span className="tnum font-bold text-slate-900">{completedTaskCount}</span> sur <span className="tnum font-bold text-slate-900">{taskCount}</span> métriques reportées. Les étapes 2 et 3 sont issues du même rapport Power BI.
                                </p>
                            </div>
                        </div>

                        {/* JAUGE */}
                        <div className="bg-white border border-slate-200/80 rounded-bento p-6 shadow-bento flex items-center justify-between gap-4">
                            <div>
                                <p className="text-[12px] font-bold uppercase tracking-wider text-slate-400">Avancement</p>
                                <p className="tnum text-3xl font-extrabold text-slate-900 mt-1">{progressPercent}%</p>
                                <p className="text-[12px] text-slate-500 mt-0.5">{totalSteps - currentDone} étapes restantes</p>
                            </div>
                            <div className="relative w-16 h-16 shrink-0 flex items-center justify-center">
                                <svg className="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
                                    <path
                                        className="text-slate-100"
                                        strokeWidth="3.5"
                                        stroke="currentColor"
                                        fill="none"
                                        d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"
                                    />
                                    <path
                                        className="text-cultura-electric transition-all duration-700 ease-out"
                                        strokeDasharray={`${progressPercent}, 100`}
                                        strokeWidth="3.5"
                                        strokeLinecap="round"
                                        stroke="currentColor"
                                        fill="none"
                                        d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"
                                    />
                                </svg>
                                <i className="fa-solid fa-bolt text-cultura-electric text-sm absolute"></i>
                            </div>
                        </div>
                    </section>

                    <main className="flex-1">

                        {/* ONGLET 1 : RELEVÉS BENTO GROUPÉS */}
                        {activeTab === 'tasks' && (
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                {SOURCE_GROUPS.map((group) => {
                                    const isGroupMulti = group.tasks.length > 1;
                                    const isGroupDone = group.tasks.every(t => completedTasks[t.id]);

                                    return (
                                        <article
                                            key={group.groupId}
                                            className={`rounded-bento border transition-all duration-300 flex flex-col justify-between shadow-bento shadow-bento-hover ${
                                                isGroupMulti ? 'md:col-span-2 lg:col-span-2 bg-gradient-to-b from-white to-slate-50/40' : 'col-span-1 bg-white'
                                            } ${
                                                isGroupDone ? 'border-slate-200/60 opacity-80' : 'border-slate-200/80 hover:border-slate-300'
                                            }`}
                                        >
                                            <div className="p-6">
                                                {/* En-tête de la source */}
                                                <div className="flex items-center justify-between gap-3 mb-5 pb-3 border-b border-slate-100">
                                                    <div className="flex items-center gap-3 min-w-0">
                                                        <div
                                                            className="w-10 h-10 rounded-inner flex items-center justify-center shrink-0 text-[14px]"
                                                            style={{ backgroundColor: group.accent + '14', color: group.accent }}
                                                        >
                                                            <i className={`fa-solid ${group.icon}`}></i>
                                                        </div>
                                                        <div className="min-w-0">
                                                            <h3 className="text-[15px] font-bold text-slate-900 leading-tight truncate">
                                                                {group.sourceTitle}
                                                            </h3>
                                                            {group.sourceBadge && (
                                                                <span className="text-[11px] font-semibold text-purple-700 bg-purple-50 border border-purple-100 px-2 py-0.5 rounded-full inline-block mt-0.5">
                                                                    {group.sourceBadge}
                                                                </span>
                                                            )}
                                                        </div>
                                                    </div>

                                                    {group.link && (
                                                        <a
                                                            href={group.link}
                                                            target="_blank"
                                                            rel="noopener noreferrer"
                                                            className="text-[12px] font-semibold text-cultura hover:text-cultura-electric transition inline-flex items-center gap-1.5 active-scale shrink-0"
                                                        >
                                                            <span>Ouvrir</span>
                                                            <i className="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                                                        </a>
                                                    )}
                                                </div>

                                                {/* Notes de groupe */}
                                                {group.accessNote && (
                                                    <div className="rounded-inner bg-slate-50 border border-slate-200/60 px-3 py-2 mb-4 flex items-center gap-2 text-slate-600 text-[12px]">
                                                        <i className="fa-solid fa-key text-slate-400"></i>
                                                        <span>{group.accessNote}</span>
                                                    </div>
                                                )}

                                                {/* Liste des tâches/colonnes associées */}
                                                <div className={`grid gap-4 ${isGroupMulti ? 'grid-cols-1 sm:grid-cols-2' : 'grid-cols-1'}`}>
                                                    {group.tasks.map((task) => {
                                                        const isDone = completedTasks[task.id];
                                                        const isExpanded = expandedTaskId === task.id;

                                                        return (
                                                            <div
                                                                key={task.id}
                                                                className={`rounded-inner border p-4 transition-all ${
                                                                    isDone ? 'bg-emerald-50/40 border-emerald-200/70' : 'bg-slate-50/70 border-slate-200/70'
                                                                }`}
                                                            >
                                                                <div className="flex items-start justify-between gap-2 mb-2">
                                                                    <div>
                                                                        <div className="flex items-center gap-2 mb-1">
                                                                            <span className="tnum text-[11px] font-bold text-slate-500 bg-white border border-slate-200 px-2 py-0.5 rounded-full">
                                                                                Étape {task.stepNum}
                                                                            </span>
                                                                            <span className="text-[11px] font-bold text-cultura bg-cultura-light px-2 py-0.5 rounded-full">
                                                                                {task.colTag}
                                                                            </span>
                                                                        </div>
                                                                        <h4 className={`text-[14px] font-bold ${isDone ? 'line-through text-slate-400' : 'text-slate-900'}`}>
                                                                            {task.title}
                                                                        </h4>
                                                                    </div>

                                                                    <button
                                                                        onClick={() => toggleTask(task.id)}
                                                                        aria-pressed={Boolean(isDone)}
                                                                        className={`w-7 h-7 rounded-full flex items-center justify-center transition active-scale shrink-0 ${
                                                                            isDone
                                                                                ? 'bg-emerald-600 text-white shadow-sm'
                                                                                : 'bg-white text-slate-300 hover:text-slate-500 border border-slate-200'
                                                                        }`}
                                                                    >
                                                                        <i className="fa-solid fa-check text-[11px]"></i>
                                                                    </button>
                                                                </div>

                                                                <p className="text-[12px] text-slate-600 font-medium mt-1">
                                                                    🎯 <span className="font-semibold">{task.targetInfo}</span>
                                                                </p>

                                                                {/* Dépliant d'étapes */}
                                                                <div className="mt-2.5 pt-2 border-t border-slate-200/60">
                                                                    <button
                                                                        onClick={() => toggleExpand(task.id)}
                                                                        className="text-[11px] font-semibold text-slate-500 hover:text-slate-800 transition flex items-center gap-1"
                                                                    >
                                                                        <i className={`fa-solid fa-chevron-right text-[9px] transition-transform ${isExpanded ? 'rotate-90' : ''}`}></i>
                                                                        <span>{isExpanded ? 'Masquer' : 'Détails filtres'}</span>
                                                                    </button>

                                                                    {isExpanded && (
                                                                        <ol className="mt-2 space-y-1.5 bg-white p-2.5 rounded-ctrl border border-slate-100 text-[11px] text-slate-600">
                                                                            {task.steps.map((step, sIdx) => (
                                                                                <li key={sIdx} className="flex items-start gap-1.5 list-none">
                                                                                    <span className="font-bold text-slate-400">•</span>
                                                                                    <span>{step}</span>
                                                                                </li>
                                                                            ))}
                                                                        </ol>
                                                                    )}
                                                                </div>
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        </article>
                                    );
                                })}
                            </div>
                        )}

                        {/* ONGLET 2 : LOOKER STUDIO */}
                        {activeTab === 'looker' && (
                            <div className="max-w-2xl mx-auto bg-white border border-slate-200/80 rounded-bento p-8 shadow-bento space-y-6">
                                <div className="flex items-start gap-4">
                                    <div className="w-12 h-12 rounded-inner bg-cultura-light text-cultura flex items-center justify-center text-lg shrink-0">
                                        <i className="fa-solid fa-magnifying-glass-chart"></i>
                                    </div>
                                    <div>
                                        <h3 className="text-lg font-bold text-slate-900 leading-snug">Vérification Looker Studio</h3>
                                        <p className="text-[13px] text-slate-500 mt-0.5">Contrôler la remontée des données saisies dans le Sheet</p>
                                    </div>
                                </div>

                                <p className="text-[13px] text-slate-600 leading-relaxed bg-slate-50 px-4 py-3.5 rounded-inner border border-slate-100">
                                    Une fois les 6 étapes de la semaine S-1 reportées dans le Google Sheet, ouvrez le rapport Looker Studio pour vérifier l'exactitude des calculs.
                                </p>

                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
                                    <a
                                        href="https://datastudio.google.com/u/0/reporting/6d2c8c2d-cbea-42db-a4e4-0e569f8d3ad3/page/p_7r97ownj8c"
                                        target="_blank"
                                        rel="noopener noreferrer"
                                        className="py-3 px-4 bg-cultura hover:bg-cultura-dark text-white font-semibold rounded-ctrl text-[13px] transition text-center flex items-center justify-center gap-2 active-scale shadow-sm"
                                    >
                                        <span>Ouvrir Looker Studio</span>
                                        <i className="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                                    </a>

                                    <button
                                        onClick={() => setLookerVerified(!lookerVerified)}
                                        aria-pressed={Boolean(lookerVerified)}
                                        className={`py-3 px-4 rounded-ctrl text-[13px] font-semibold transition flex items-center justify-center gap-2 border active-scale ${
                                            lookerVerified
                                                ? 'bg-emerald-50 border-emerald-200 text-emerald-700'
                                                : 'bg-white border-slate-200 text-slate-700 hover:bg-slate-50'
                                        }`}
                                    >
                                        <i className={`fa-solid ${lookerVerified ? 'fa-circle-check text-emerald-600' : 'fa-circle text-slate-300'} text-[12px]`}></i>
                                        <span>{lookerVerified ? 'Remontée validée' : 'Valider la vérification'}</span>
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* ONGLET 3 : CAPTURES PPT */}
                        {activeTab === 'ppt' && (
                            <div className="space-y-4">
                                <p className="text-[13px] text-slate-500 px-1 font-medium">
                                    Captures Looker Studio à insérer dans le PPT Weekly.
                                </p>

                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                    {LOOKER_SLIDES.map((slide) => {
                                        const isDone = slidesDone[slide.id];
                                        return (
                                            <button
                                                key={slide.id}
                                                onClick={() => toggleSlide(slide.id)}
                                                aria-pressed={Boolean(isDone)}
                                                className={`text-left w-full rounded-bento p-5 transition-all border flex items-center justify-between gap-4 shadow-bento shadow-bento-hover active-scale ${
                                                    isDone
                                                        ? 'bg-slate-50/70 border-slate-200/60 opacity-80'
                                                        : 'bg-white border-slate-200/80 hover:border-slate-300'
                                                }`}
                                            >
                                                <div className="flex items-center gap-3.5 min-w-0">
                                                    <div className={`w-10 h-10 rounded-inner flex items-center justify-center text-[14px] shrink-0 ${
                                                        isDone ? 'bg-slate-100 text-slate-400' : 'bg-cultura-light text-cultura'
                                                    }`}>
                                                        <i className={`fa-solid ${slide.icon}`}></i>
                                                    </div>
                                                    <div className="min-w-0">
                                                        <h4 className={`text-[14px] font-bold leading-tight ${isDone ? 'line-through text-slate-400' : 'text-slate-900'}`}>
                                                            {slide.label}
                                                        </h4>
                                                        <p className="text-[12px] text-slate-500 mt-1 truncate">{slide.desc}</p>
                                                    </div>
                                                </div>

                                                <div className={`w-7 h-7 rounded-full flex items-center justify-center text-[11px] shrink-0 transition ${
                                                    isDone ? 'bg-emerald-600 text-white' : 'border-2 border-slate-200 text-transparent'
                                                }`}>
                                                    <i className="fa-solid fa-check"></i>
                                                </div>
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                    </main>

                    {/* PIED DE PAGE */}
                    <footer className="mt-10 pt-5 border-t border-slate-200/80 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 text-slate-500">
                        <p className="text-[12px]">
                            Maintenu par {MAINTAINER} · {LAST_UPDATE} · Support sur {MAINTAINER_CONTACT}.
                        </p>
                        <button
                            onClick={() => setShowResetModal(true)}
                            className="text-[12px] font-semibold text-slate-500 hover:text-slate-800 transition flex items-center gap-2 self-start sm:self-auto"
                        >
                            <i className="fa-solid fa-arrow-rotate-left text-[11px]"></i>
                            Réinitialiser la journée
                        </button>
                    </footer>

                    {/* TOAST */}
                    {toast && (
                        <div role="status" aria-live="polite" className="fixed top-6 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white text-[13px] font-semibold px-4 py-2.5 rounded-ctrl shadow-2xl flex items-center gap-2.5">
                            <i className="fa-solid fa-circle-check text-emerald-400 text-[12px]"></i>
                            <span>{toast}</span>
                        </div>
                    )}

                    {/* MODALE DE RÉINITIALISATION */}
                    {showResetModal && (
                        <div
                            className="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4"
                            onClick={() => setShowResetModal(false)}
                        >
                            <div
                                role="dialog"
                                aria-modal="true"
                                aria-label="Réinitialiser la progression"
                                className="bg-white rounded-bento max-w-sm w-full p-6 space-y-4 shadow-2xl border border-slate-200/60"
                                onClick={(e) => e.stopPropagation()}
                            >
                                <div className="w-11 h-11 rounded-inner bg-red-50 text-red-600 flex items-center justify-center text-base">
                                    <i className="fa-solid fa-triangle-exclamation"></i>
                                </div>
                                <div>
                                    <h3 className="text-base font-bold text-slate-900">Réinitialiser la progression ?</h3>
                                    <p className="text-[13px] text-slate-500 leading-relaxed mt-1">
                                        Toutes les étapes cochées repasseront à faire. Les données déjà saisies dans le Google Sheet restent inchangées.
                                    </p>
                                </div>
                                <div className="flex items-center gap-2 pt-1">
                                    <button
                                        onClick={() => setShowResetModal(false)}
                                        className="flex-1 py-2.5 bg-slate-100 hover:bg-slate-200/80 text-slate-700 font-semibold rounded-ctrl text-[13px] transition"
                                    >
                                        Annuler
                                    </button>
                                    <button
                                        onClick={resetAll}
                                        className="flex-1 py-2.5 bg-red-600 hover:bg-red-700 text-white font-semibold rounded-ctrl text-[13px] transition"
                                    >
                                        Réinitialiser
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* DOCK MOBILE */}
                    <nav className="fixed bottom-4 left-4 right-4 max-w-sm mx-auto glass-dock border border-slate-200/80 rounded-full z-40 p-1.5 shadow-2xl md:hidden">
                        <div className="flex items-center justify-around">
                            {tabs.map((tab) => (
                                <button
                                    key={tab.id}
                                    onClick={() => setActiveTab(tab.id)}
                                    aria-current={activeTab === tab.id ? 'page' : undefined}
                                    className={`flex flex-col items-center gap-1 py-1.5 px-5 rounded-full transition ${
                                        activeTab === tab.id ? 'text-cultura-electric font-bold' : 'text-slate-500 font-medium'
                                    }`}
                                >
                                    <i className={`fa-solid ${tab.icon} text-[15px]`}></i>
                                    <span className="text-[11px]">
                                        {tab.short}
                                    </span>
                                </button>
                            ))}
                        </div>
                    </nav>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
